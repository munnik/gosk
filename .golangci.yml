---
# gosk does not lint broadly - this file exists to enforce one invariant
# mechanically, so every other linter is off. Turning more on is a
# separate decision: the codebase has never been linted, so enabling the
# defaults would surface a backlog of findings and block every commit
# until it is worked through.
version: "2"

linters:
  default: none
  enable:
    - forbidigo

  settings:
    forbidigo:
      # Patterns match the source text of the call; pkg additionally
      # requires it to resolve to the uuid package, so a local package
      # that happens to expose a New is not caught by mistake.
      #
      # Note this does mean the patterns assume the usual unaliased
      # import. An aliased one would read differently and slip past - if
      # that ever shows up, the pattern is what has to grow.
      analyze-types: true
      forbid:
        - pattern: ^uuid\.NewV4$
          pkg: ^github\.com/munnik/uuid/v5$
          msg: >-
            Use uuid.Must(uuid.NewV7Precise()). Version 4 UUIDs are
            random, so they scatter every insert across mapped_data's uuid
            index; version 7 leads with a timestamp and appends in order.
            See section 6 of TRANSFER_REVIEW.md.
        - pattern: ^uuid\.NewV7$
          pkg: ^github\.com/munnik/uuid/v5$
          msg: >-
            Use uuid.Must(uuid.NewV7Precise()). Plain NewV7 spends rand_a
            on a counter, so its timestamp resolves only to a
            millisecond - too coarse for the 2kHz sources, and read back
            wrong by uuid_timestamp_micros. See section 7.3.
        - pattern: ^uuid\.NewV7AtTime$
          pkg: ^github\.com/munnik/uuid/v5$
          msg: >-
            Use uuid.NewV7AtTimePrecise, for the same reason as NewV7.
        - pattern: ^uuid\.NewV1$
          pkg: ^github\.com/munnik/uuid/v5$
          msg: >-
            Use uuid.Must(uuid.NewV7Precise()). Version 1 embeds the
            host's MAC address.
        - pattern: ^uuid\.NewV6$
          pkg: ^github\.com/munnik/uuid/v5$
          msg: >-
            Use uuid.Must(uuid.NewV7Precise()), version 6 is the
            transitional format version 7 replaces.

  exclusions:
    # Generated code is regenerated from its source, not edited, so a
    # finding in it cannot be acted on where it is reported.
    generated: lax
