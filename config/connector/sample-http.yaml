---
name: "http test"  # name is used in the key of the collected data
protocol: "http"
urlGroups:  # groups of registers that should be read in one request
  - url: "http://www.google.com/"
    # interval between consecutive reads in ns
    # [optional default is 1000000000 (1s)]
    pollingInterval: 500000000

# how long to wait without any data before raising the "no data received"
# Signal K notification for this connector, and how often to repeat it while
# it stays quiet [optional]
# left unset, this is twice the slowest pollingInterval above, or 30s when
# that is shorter - so a register group read once a minute gets 2m without
# saying anything here. Set it when the sensor's real pace is slower than the
# interval it is polled on.
# timeout: 2m
