---
# name is used in the key of the collected data
name: "NMEA0183 simulator"
protocol: "nmea0183"
# url of the connection, tcp:// and udp:// are supported for network
# connections, use file:///dev/ttyUSB0 for a serial device connection
url: "tcp://127.0.0.1:13400"
# when url is a network connection this determines whether to dial or listen
# for a connection [optional default is false]
listen: false
# when url is a serial device this determines the baud rate for setting up
# the connection [optional default is 4800]
baudRate: 4800
# when url is a serial device this determines the number of data bits
# (5, 6, 7 or 8) for setting up the connection [optional default is 8]
dataBits: 8
# when url is a serial device this determines the number of stop bits
# (1 or 2) for setting up the connection [optional default is 1]
stopBits: 1
# when url is a serial device this determines the parity
# (N - None, O - Odd, E - Even) for setting up the connection
# [optional default is "E"]
parity: "E"

# how long to wait without any data before raising the "no data received"
# Signal K notification for this connector, and how often to repeat it while
# it stays quiet [optional default is 30s]
# there is no polling interval to size this from, so set it whenever this
# source may legitimately stay silent for longer than the default
# timeout: 2m
